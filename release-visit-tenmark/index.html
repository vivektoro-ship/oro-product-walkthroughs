<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release Visit Revamp — Tenmark Gold Loans</title>
<meta name="description" content="Walkthrough prototype for the Tenmark gold loan release visit: partner app, Oromoney and Tenmark CORE, side by side.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --accent:#2B50E8;
    --accent-soft:#E4EAFD;
    --accent-deep:#1B39C4;
    --page:#F6F8FC;
    --panel:#FFFFFF;
    --ink:#0E1220;
    --ink-2:#5A6076;
    --ink-3:#8F95A8;
    --red:#D6392F;
    --red-soft:#FBE9E7;
    --rule:#E3E8F2;
    --rule-strong:#CDD5E6;

    --display:'Bricolage Grotesque','Manrope',system-ui,sans-serif;
    --body:'Manrope',system-ui,-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;

    --phone-w:312px;
    --phone-h:640px;
    --page-max:1240px;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}

  body{
    margin:0;background:var(--page);color:var(--ink);
    font-family:var(--body);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:var(--page-max);margin:0 auto;padding:44px 22px 90px;}
  a{color:var(--accent);text-underline-offset:2px;}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:4px;}

  .eyebrow{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink-3);margin:0 0 18px;
  }

  h1{
    font-family:var(--display);font-weight:800;
    font-size:clamp(36px,5.2vw,56px);line-height:.98;letter-spacing:-.035em;
    margin:0 0 16px;text-wrap:balance;max-width:17ch;
  }
  h1 .hl{color:var(--accent);}

  .lede{font-size:17px;color:var(--ink-2);max-width:62ch;margin:0 0 20px;}

  .meta{display:flex;flex-wrap:wrap;gap:8px;font-family:var(--mono);font-size:11.5px;margin:0 0 34px;}
  .meta span{
    background:var(--panel);border:1px solid var(--rule);border-radius:999px;
    padding:5px 11px;color:var(--ink-2);
  }
  .meta a{text-decoration:none;}

  /* ---------- path pills ---------- */
  .paths{
    display:inline-flex;gap:4px;padding:4px;background:var(--panel);
    border:1px solid var(--rule);border-radius:999px;margin-bottom:24px;
  }
  .paths button{
    font-family:var(--body);font-weight:700;font-size:14px;color:var(--ink-2);
    background:transparent;border:0;border-radius:999px;padding:9px 20px;cursor:pointer;
    transition:background .18s ease,color .18s ease;
  }
  .paths button[aria-pressed="true"]{background:var(--accent);color:#fff;}
  .paths button:hover:not([aria-pressed="true"]){background:var(--accent-soft);color:var(--accent-deep);}

  .switches{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px;}
  .switches .paths{margin-bottom:0;}

  /* CORE section: one browser, no phones and no connector */
  .stage.is-core{grid-template-columns:1fr;}
  .stage.is-core #side-left,.stage.is-core .connector{display:none;}
  .stage.is-core .browser{max-width:1000px;}

  /* ---------- stage ---------- */
  .stage{
    position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;
    background:var(--panel);border:1px solid var(--rule);border-radius:22px;padding:30px 28px 26px;
  }
  .side{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0;}

  .side-label{
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-3);display:flex;align-items:center;gap:7px;margin:0;
  }
  .side-label .dot{width:7px;height:7px;border-radius:50%;background:var(--rule-strong);}
  .side.is-active .side-label{color:var(--accent-deep);}
  .side.is-active .side-label .dot{background:var(--accent);}

  .device-wrap{
    width:100%;flex:1 1 auto;display:flex;justify-content:center;align-items:flex-start;
    transition:opacity .3s ease,filter .3s ease;
  }
  .side.is-dim .device-wrap{opacity:.4;filter:grayscale(1);}

  .phone{
    width:var(--phone-w);height:var(--phone-h);flex:0 0 auto;
    background:#0E1220;border-radius:30px;padding:8px;
    box-shadow:0 16px 36px -20px rgba(14,18,32,.55);
  }
  .phone-screen{
    width:100%;height:100%;border-radius:23px;background:var(--page);position:relative;
    /* ! Exports run 835 to 1176 tall against a 640 frame, so the screen scrolls
     * ! inside the device rather than the device stretching or cropping. */
    overflow-y:auto;overflow-x:hidden;
    /* ! Scrolls, but shows no scrollbar - the device should read as a device. */
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .phone-screen::-webkit-scrollbar{width:0;height:0;display:none;}

  .browser{
    width:100%;max-width:720px;aspect-ratio:1440/1100;
    background:#0E1220;border-radius:12px;padding:0 4px 4px;
    box-shadow:0 16px 36px -20px rgba(14,18,32,.55);display:flex;flex-direction:column;
  }
  .browser-bar{height:24px;display:flex;align-items:center;gap:6px;padding:0 10px;flex:0 0 auto;}
  .browser-bar i{width:8px;height:8px;border-radius:50%;background:#454B60;display:block;}
  .browser-bar b{
    margin-left:8px;font-family:var(--mono);font-size:10px;font-weight:400;
    color:#9AA1B8;background:#22283C;border-radius:5px;padding:2px 9px;
  }
  .browser-screen{
    flex:1 1 auto;border-radius:8px;background:var(--page);position:relative;
    overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;
  }
  .browser-screen::-webkit-scrollbar{width:0;height:0;display:none;}

  .shot{width:100%;height:auto;display:block;}

  /* tap to advance */
  .tapzone{cursor:pointer;position:relative;}
  .tapzone::after{
    content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    box-shadow:0 0 0 0 rgba(43,80,232,0);transition:box-shadow .18s ease;
  }
  .tapzone:hover::after{box-shadow:0 0 0 3px rgba(43,80,232,.35);}
  .tapzone:focus-visible{outline:none;}
  .tapzone:focus-visible::after{box-shadow:0 0 0 3px var(--accent);}
  .taphint{
    font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-3);opacity:0;transition:opacity .18s ease;
  }
  .side:hover .taphint{opacity:1;}

  /* placeholders */
  .ph{
    width:100%;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:22px;text-align:center;
    background-image:repeating-linear-gradient(135deg,#FBEDEC 0 9px,#FEF7F6 9px 18px);
  }
  .ph.is-none{background-image:repeating-linear-gradient(135deg,#EEF2FA 0 9px,#F8FAFE 9px 18px);}
  .ph-badge{
    font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:#fff;background:var(--red);border-radius:5px;padding:4px 9px;
  }
  .ph.is-none .ph-badge{background:var(--ink-3);}
  .ph-name{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-weight:500;word-break:break-all;}
  .ph-path{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);word-break:break-all;max-width:100%;}
  .ph-note{font-size:12px;color:var(--ink-2);max-width:26ch;line-height:1.45;}

  /* connector */
  .connector{
    position:relative;width:70px;align-self:stretch;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .connector .line{position:absolute;top:6px;bottom:6px;left:50%;width:1px;background:var(--rule-strong);transform:translateX(-50%);}
  .connector .pip{
    position:relative;width:11px;height:11px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 5px var(--panel),0 0 0 6px var(--accent-soft);
  }
  .connector .handoff{
    position:relative;margin-top:12px;font-family:var(--mono);font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;writing-mode:vertical-rl;
  }

  /* doc-set selector */
  .docset{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
  .docset[hidden]{display:none;}
  .docset button{
    font-family:var(--mono);font-size:10.5px;color:var(--ink-2);background:var(--panel);
    border:1px solid var(--rule);border-radius:6px;padding:4px 9px;cursor:pointer;
  }
  .docset button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
  .docset button:hover:not([aria-pressed="true"]){border-color:var(--accent);color:var(--accent-deep);}

  /* ---------- caption ---------- */

  /* ---------- rail + nav ---------- */
  .navrow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;margin-top:20px;}
  .rail{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 460px;min-width:0;}
  .rail button{
    font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink-2);background:var(--panel);
    border:1px solid var(--rule);border-radius:7px;padding:6px 10px;cursor:pointer;
    transition:background .16s ease,color .16s ease,border-color .16s ease;
  }
  .rail button:hover{border-color:var(--accent);color:var(--accent-deep);}
  .rail button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
  .rail button.is-fail{border-style:dashed;border-color:var(--rule-strong);color:var(--ink-3);}
  .rail button.is-fail:hover{border-color:var(--red);color:var(--red);}
  .rail button.is-fail[aria-current="true"]{background:var(--red);border-color:var(--red);color:#fff;}

  .steppers{display:flex;gap:8px;}
  .steppers button{
    font-family:var(--body);font-weight:700;font-size:13.5px;background:var(--ink);color:#fff;
    border:1px solid var(--ink);border-radius:9px;padding:9px 18px;cursor:pointer;
  }
  .steppers button:hover:not(:disabled){background:var(--accent-deep);border-color:var(--accent-deep);}
  .steppers button:disabled{background:transparent;color:var(--ink-3);border-color:var(--rule);cursor:not-allowed;}
  .counter{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);align-self:center;}

  /* ---------- export table ---------- */

  @media (max-width:960px){
    .stage{grid-template-columns:1fr;gap:26px;padding:24px 16px;}
    .connector{display:none;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">ENG-4953 · walkthrough prototype</p>
    <h1>Release visit, <span class="hl">relayed</span> between two phones</h1>
  </header>

  <div class="switches">
    <div class="paths" role="group" aria-label="Surface">
      <button type="button" data-section="apps" aria-pressed="true">Apps</button>
      <button type="button" data-section="core" aria-pressed="false">Tenmark CORE</button>
    </div>
    <div class="paths" role="group" aria-label="Release path">
      <button type="button" data-path="regular" aria-pressed="true">Regular release</button>
      <button type="button" data-path="tp" aria-pressed="false">Third party release</button>
    </div>
  </div>

  <section class="stage" aria-label="Screens for this step">
    <div class="side" id="side-left">
      <p class="side-label"><span class="dot"></span><span>Partner app</span><span class="taphint">tap to advance</span></p>
      <div class="device-wrap" id="left-device"></div>
      <div class="docset" id="docset" hidden></div>
    </div>

    <div class="connector" aria-hidden="true">
      <div class="line"></div>
      <div class="pip"></div>
      <div class="handoff" id="handoff">both</div>
    </div>

    <div class="side" id="side-right">
      <p class="side-label"><span class="dot"></span><span id="right-label">Oromoney</span><span class="taphint">tap to advance</span></p>
      <div class="device-wrap" id="right-device"></div>
    </div>
  </section>

  <nav class="navrow" aria-label="Steps">
    <div class="rail" id="rail"></div>
    <div class="steppers">
      <button type="button" id="prev">Back</button>
      <button type="button" id="next">Next</button>
    </div>
    <span class="counter" id="counter"></span>
  </nav>

</div>

       d:'Mandatory on both paths, no retake limit, and the visit cannot complete without it.'},
      {id:'proof-captured', a:'px-proof-captured', b:'cx-collect', actor:'agent', state:'Receipt Confirmed',
       t:'Photo captured',
       d:'Persisted against the visit, tagged with the role of the person in frame.'},
      {id:'complete', a:'px-complete', b:'cx-complete', actor:'both', state:'Completed',
       t:'Visit closed on both sides',
       d:'Verification outcomes, the signed document, the receipt confirmation and the handover photo all sit on the visit record.'},
      {id:'loan-closed', a:null, b:'cx-loan-closed', actor:'customer', state:'Completed',
       t:'The loan now shows as released',
       d:'The customer side reflects the closed loan with the collateral released.'},

      {id:'item-not-matched', a:'px-item-not-matched', b:'cx-gold-wait', actor:'agent', state:'Gold Verification Pending', fail:true,
       t:'An item is flagged against one of seven fixed reasons',
       d:'Loss, damage, stone missing, weight reduction, bend or breakage, change in ornament type, or a specific part missing. The reason is mandatory; remarks stay optional.'},
      {id:'items-has-mismatch', a:'px-items-has-mismatch', b:'cx-gold-wait', actor:'agent', state:'Gold Verification Pending', fail:true,
       t:'The button changes to finish verification',
       d:'With any item flagged the primary CTA stops being a completion action.'},
      {id:'items-mismatch-confirm', a:'px-items-mismatch-confirm', b:'cx-gold-wait', actor:'agent', state:'Gold Verification Pending', fail:true,
       t:'Confirmation before the block lands',
       d:'The modal counts the flagged items and asks the agent to confirm.'},
      {id:'blocked', a:'px-blocked', b:'cx-on-hold', actor:'agent', state:'Release Visit Blocked', fail:true,
       t:'Terminal. The customer is told only that there is a technical issue',
       d:'Any single flag blocks the visit on every surface. Resolution is manual and off-app, decided case by case.'}
    ]),

    tp: SHARED.concat([
      {id:'tp-release-path', a:'tp-release-path', b:'cx-gold-wait', actor:'agent', state:'Gold Verified',
       t:'Someone else is collecting. No signing on this path',
       d:'No eSign and no release letter is generated. The record is the uploaded documents plus the handover photo.'},
      {id:'tp-details', a:'tp-details', b:'cx-gold-wait', actor:'agent', state:'Third Party Documents Pending',
       t:'Five identity fields captured as data, not scans',
       d:'Full name, relationship to the customer, PAN, Aadhaar and mobile number, alongside the KYC uploads rather than instead of them.'},
      {id:'tp-category', a:'tp-category', b:'cx-gold-wait', actor:'agent', state:'Third Party Documents Pending',
       t:'Four reasons, four different document sets',
       d:'Death case, customer missing, customer abroad or out of city, customer sick or hospitalised.'},
      {id:'tp-docs-empty', a:'tp-docs-empty', b:'cx-gold-wait', actor:'agent', state:'Third Party Documents Pending', docset:true,
       t:'Death case needs six documents, the rest need seven',
       d:'Every document is mandatory. Switch the set under the phone to see what each category asks for.'},
      {id:'tp-docs-source', a:'tp-docs-source', b:'cx-gold-wait', actor:'agent', state:'Third Party Documents Pending',
       t:'Camera or gallery',
       d:'Uploads happen in the partner app only. Nothing is ever uploaded from CORE. JPG, PNG or PDF up to 10 MB.'},
      {id:'tp-docs-uploaded', a:'tp-docs-uploaded', b:'cx-gold-wait', actor:'agent', state:'Third Party Documents Pending',
       t:'All uploaded',
       d:'Each document is held against the visit as it lands.'},
      {id:'tp-docs-confirm', a:'tp-docs-confirm', b:'cx-gold-wait', actor:'agent', state:'Third Party Documents Pending',
       t:'Partial sets cannot be submitted',
       d:'A failed or missing upload blocks submission for approval.'},
      {id:'tp-pending', a:'tp-pending', b:'cx-gold-wait', actor:'agent', state:'Pending Third Party Approval',
       t:'Submitted, and now it waits on CORE',
       d:'The only step measured in days. Nothing moves in the app until Tenmark Central Operations decides - see the CORE section for that half.'},
      {id:'tp-approved', a:'tp-approved', b:'cx-gold-wait', actor:'agent', state:'Third Party Approved',
       t:'Cleared to hand over',
       d:'The approval lands back in the partner app and the release can be processed.'},
      {id:'tp-receipt', a:'px-wait-receipt', b:'cx-collect', actor:'customer', state:'Receipt Confirmed',
       t:'Still the customer own login, even in death cases',
       d:'A stated accepted risk, not an oversight. The controlling evidence here is the document set, the approval and the handover photo.'},
      {id:'tp-proof-empty', a:'tp-proof-empty', b:'cx-collect', actor:'agent', state:'Receipt Confirmed',
       t:'Photo of whoever collected',
       d:'Nominee or legal heir for death and missing cases, the third party for the two regular reasons.'},
      {id:'tp-proof-captured', a:'tp-proof-captured', b:'cx-collect', actor:'agent', state:'Receipt Confirmed',
       t:'Captured',
       d:'Stored against the visit with that role recorded.'},
      {id:'tp-complete', a:'tp-complete', b:'cx-complete', actor:'both', state:'Completed',
       t:'No signature artefact exists on this path',
       d:'The paper trail is the approved document set, the approval reason and the handover photo.'},

      {id:'tp-rejected', a:'tp-rejected-px', b:'cx-gold-wait', actor:'agent', state:'Third Party Rejected', fail:true,
       t:'Visit closes. Payment and ledger untouched. The customer books again from zero',
       d:'Fresh pickup, fresh code, fresh live photo, fresh verification - and either path may be chosen next time. There is no cap on rescheduling.'}
    ])
  };

  var CORE = {
    regular: [
      {id:'visits-listing', b:'core-visit-listing', state:'Visit Confirmed',
       t:'The release visits queue', d:'CORE is visibility, the mismatch table and third party approval. The visit is not worked here.'},
      {id:'visit-detail', b:'core-visit-detail', state:'Visit Started',
       t:'A visit in CORE', d:'Everything recorded against the release, read-only for most roles.'},
      {id:'gold-items', b:'core-gold-items', state:'Gold Verified',
       t:'The gold items and their outcomes', d:'Item-level status, reason, remarks, agent identity and timestamp, as submitted from the partner app.'},
      {id:'item-detail', b:'core-item-detail', state:'Gold Verified',
       t:'One item, in full', d:'The valuation record beside what the agent recorded on the day.'},
      {id:'item-flagged', b:'core-item-flagged', state:'Release Visit Blocked', fail:true,
       t:'A flagged item in the mismatch table', d:'Flagged items surface here with reason and remarks. Visible to anyone with access to the page - no dedicated permission gates it.'},
      {id:'activity-log', b:'core-activity-log', state:'Completed',
       t:'Activity log', d:'Every state change is written server side and readable here.'},
      {id:'log-regular', b:'core-log-regular', state:'Completed',
       t:'The regular release, end to end', d:'The full trail for a visit that closed on eSign and handover.'}
    ],
    tp: [
      {id:'approval-documents', b:'core-approval-documents', state:'Pending Third Party Approval',
       t:'The only step measured in days', d:'The approver holding Approve Third Party Release sees the identity details and every uploaded document. Nothing is uploaded from here.'},
      {id:'approve-confirm', b:'core-approve-confirm', state:'Pending Third Party Approval',
       t:'A reason is required either way', d:'Approval and rejection are both recorded against the visit with actor, reason and timestamp.'},
      {id:'approved', b:'core-approved', state:'Third Party Approved',
       t:'Approved', d:'The visit moves to Third Party Approved and handover can proceed.'},
      {id:'reject-confirm', b:'core-reject-confirm', state:'Pending Third Party Approval', fail:true,
       t:'Rejecting runs through the same surface', d:'Same screen, opposite outcome.'},
      {id:'reject-reason', b:'core-reject-reason', state:'Pending Third Party Approval', fail:true,
       t:'Rejection reason recorded', d:'Mandatory, and written against the visit with the approver identity.'},
      {id:'rejected', b:'core-rejected', state:'Third Party Rejected', fail:true,
       t:'Visit closes, payment and ledger untouched', d:'The customer returns to the schedule stage and books again from zero, on either path.'},
      {id:'log-third-party', b:'core-log-third-party', state:'Third Party Rejected',
       t:'The third party trail', d:'Documents, approval or rejection reason, and the handover photo.'}
    ]
  };

  var SECTIONS = {apps: APPS, core: CORE};

  var DOCSETS = [
    {key:'tp-docs-death', label:'death case'},
    {key:'tp-docs-missing', label:'customer missing'},
    {key:'tp-docs-abroad', label:'abroad'},
    {key:'tp-docs-sick', label:'sick'}
  ];

  var HANDOFF = {agent:'agent acts, customer waits', customer:'customer acts, agent waits', both:'both sides live', core:'agent waits, CORE decides'};

  var state = {section:'apps', path:'regular', index:0, docset:0};

  var el = {};
  ['left-device','right-device','side-left','side-right','right-label','handoff',
   'rail','prev','next','counter','docset']
    .forEach(function (id) { el[id] = document.getElementById(id); });

  function steps(){ return SECTIONS[state.section][state.path]; }
  function step(){ return steps()[state.index]; }

  function placeholder(kind, key) {
    var d = document.createElement('div');
    d.className = 'ph' + (kind === 'none' ? ' is-none' : '');
    var b = document.createElement('span');
    b.className = 'ph-badge';
    b.textContent = kind === 'todo' ? 'Not designed' : (kind === 'none' ? 'No screen' : 'Not exported');
    d.appendChild(b);
    if (key) {
      var n = document.createElement('span'); n.className = 'ph-name'; n.textContent = key; d.appendChild(n);
    }
    var note = document.createElement('span');
    if (kind === 'missing') { note.className = 'ph-path'; note.textContent = DIR + key + '.png'; }
    else if (kind === 'todo') { note.className = 'ph-note'; note.textContent = 'This screen has not been designed yet.'; }
    else { note.className = 'ph-note'; note.textContent = 'This side has no screen at this step.'; }
    d.appendChild(note);
    return d;
  }

  function screenNode(key) {
    if (!key) return placeholder('none', null);
    if (SCREENS[key] === null) return placeholder('todo', key);
    var img = document.createElement('img');
    img.className = 'shot';
    img.alt = key;
    img.src = DIR + key + '.png?v=' + BUILD;
    img.addEventListener('error', function () {
      if (img.parentNode) img.parentNode.replaceChild(placeholder('missing', key), img);
    });
    return img;
  }

  function tappable(node) {
    // ! Clickable non-button, so it needs the keyboard affordances a button gets free.
    node.classList.add('tapzone');
    node.tabIndex = 0;
    node.setAttribute('role', 'button');
    node.setAttribute('aria-label', 'Next step');
    node.addEventListener('click', function () {
      // ! Ignore the click that ends a drag-scroll inside the screen.
      if (window.getSelection && String(window.getSelection())) return;
      move(1);
    });
    node.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); move(1); }
    });
    return node;
  }

  function phone(key) {
    var o = document.createElement('div'); o.className = 'phone';
    var i = document.createElement('div'); i.className = 'phone-screen';
    i.appendChild(screenNode(key)); o.appendChild(i); return o;
  }

  function browser(key) {
    var o = document.createElement('div'); o.className = 'browser';
    var bar = document.createElement('div'); bar.className = 'browser-bar';
    bar.appendChild(document.createElement('i'));
    bar.appendChild(document.createElement('i'));
    bar.appendChild(document.createElement('i'));
    var u = document.createElement('b');
    u.textContent = 'core.tenmark.in / release-visits / third-party-approvals';
    bar.appendChild(u); o.appendChild(bar);
    var i = document.createElement('div'); i.className = 'browser-screen';
    i.appendChild(screenNode(key)); o.appendChild(i); return o;
  }

  function buildDocset() {
    el.docset.textContent = '';
    DOCSETS.forEach(function (d, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = d.label;
      b.setAttribute('aria-pressed', String(i === state.docset));
      b.addEventListener('click', function (e) { e.stopPropagation(); state.docset = i; render(); });
      el.docset.appendChild(b);
    });
  }

  function render() {
    var s = step();
    var isCore = state.section === 'core';
    var leftKey = s.docset ? DOCSETS[state.docset].key : s.a;

    document.querySelector('.stage').className = 'stage' + (isCore ? ' is-core' : '');

    el['left-device'].textContent = '';
    el['right-device'].textContent = '';
    if (!isCore) el['left-device'].appendChild(tappable(phone(leftKey)));
    el['right-device'].appendChild(tappable(isCore ? browser(s.b) : phone(s.b)));

    el['right-label'].textContent = isCore ? 'Tenmark CORE' : 'Oromoney';

    if (!isCore) {
      var leftOn = s.actor === 'agent' || s.actor === 'both';
      var rightOn = s.actor === 'customer' || s.actor === 'both';
      el['side-left'].className = 'side ' + (leftOn ? 'is-active' : 'is-dim');
      el['side-right'].className = 'side ' + (rightOn ? 'is-active' : 'is-dim');
      el.handoff.textContent = HANDOFF[s.actor];
    } else {
      el['side-right'].className = 'side is-active';
    }
    if (s.docset) { el.docset.hidden = false; buildDocset(); } else { el.docset.hidden = true; }

    Array.prototype.forEach.call(el.rail.children, function (b, i) {
      b.setAttribute('aria-current', i === state.index ? 'true' : 'false');
    });
    el.prev.disabled = state.index === 0;
    el.next.disabled = state.index === steps().length - 1;
    el.counter.textContent = (state.index + 1) + ' / ' + steps().length;
  }

  function buildRail() {
    el.rail.textContent = '';
    steps().forEach(function (s, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = s.id;
      if (s.fail) b.className = 'is-fail';
      b.addEventListener('click', function () { state.index = i; render(); });
      el.rail.appendChild(b);
    });
  }

  function sync() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-section]'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-section') === state.section));
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-path]'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-path') === state.path));
    });
    buildRail(); render();
  }
  function setSection(x) { state.section = x; state.index = 0; sync(); }
  function setPath(p) { state.path = p; state.index = 0; sync(); }

  function move(n) {
    var i = state.index + n;
    if (i < 0 || i >= steps().length) return;
    state.index = i; render();
  }


  Array.prototype.forEach.call(document.querySelectorAll('[data-section]'), function (b) {
    b.addEventListener('click', function () { setSection(b.getAttribute('data-section')); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-path]'), function (b) {
    b.addEventListener('click', function () { setPath(b.getAttribute('data-path')); });
  });
  el.prev.addEventListener('click', function () { move(-1); });
  el.next.addEventListener('click', function () { move(1); });
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (e.key === 'ArrowRight') move(1);
    else if (e.key === 'ArrowLeft') move(-1);
  });

  sync();
})();
</script>
</body>
</html>
